name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Copy the guide into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DP-Field-Guide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DP-Field-Guide-apk
          path: DP-Field-Guide.apk

      - name: Publish to the "Latest Android build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android build
          prerelease: true
          make_latest: false
          body: |
            Built automatically from the latest commit (${{ github.sha }}).
            On your Pixel: open this page, tap DP-Field-Guide.apk, then open the download and allow installs from your browser if Android asks.
          files: DP-Field-Guide.apk
